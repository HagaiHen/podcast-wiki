# Publishes wiki/ as a website (Quartz) at https://hagaihen.github.io/podcast-wiki/ on every push.
name: site
on:
  push:
    branches: [podcast-wiki]
    paths: [wiki/**, tools/site_titles.py, .github/workflows/site.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: jackyzha0/quartz, ref: v4.5.2, path: quartz }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build
        working-directory: quartz
        run: |
          npm ci
          rm -rf content && cp -r ../wiki content
          python3 ../tools/site_titles.py content
          curl -fsSL -o content/podcast-wiki-promo.mp4 https://github.com/HagaiHen/podcast-wiki/releases/download/v0.1.0/podcast-wiki-promo.mp4  # kept out of git: the plugin directory refuses files over 5 MiB
          sed -i \
            -e 's|pageTitle: "Quartz 4"|pageTitle: "Podcast Wiki"|' \
            -e 's|baseUrl: "quartz.jzhao.xyz"|baseUrl: "hagaihen.github.io/podcast-wiki"|' \
            -e 's|provider: "plausible",|provider: null,|' \
            quartz.config.ts
          # footer on every page links back to the repo
          sed -i \
            -e 's|GitHub: "https://github.com/jackyzha0/quartz"|"⭐ Star on GitHub": "https://github.com/HagaiHen/podcast-wiki"|' \
            -e 's|"Discord Community": "https://discord.gg/cRFFHYye7t"|"How it works": "https://github.com/HagaiHen/podcast-wiki#how-it-works"|' \
            quartz.layout.ts
          npx quartz build
          # Google Search Console ownership check (homepage only)
          sed -i 's|<head>|<head><meta name="google-site-verification" content="N6rDioCLCQDXwXQhTr70fFjqsuil13pR7IYemQqRm8I"/>|' public/index.html
          # llms.txt: the index with wikilinks turned into absolute URLs, for LLM crawlers
          { echo "# Podcast Wiki"; echo; echo "> Topics learned from AI/tech podcasts, synthesized across episodes. Source: https://github.com/HagaiHen/podcast-wiki"; echo; echo "Full text of every concept page: https://hagaihen.github.io/podcast-wiki/llms-full.txt"; echo
            awk 'NR==1&&/^---/{f=1;next} f&&/^---/{f=0;next} !f' content/index.md | grep -v '^<video' | sed -E 's#\[\[([^]|]+)\]\]#[\1](https://hagaihen.github.io/podcast-wiki/\1)#g'; } > public/llms.txt
          # llms-full.txt: the full text of every concept page in one file
          for f in content/concepts/*.md; do
            echo "# $(sed -n 's/^title: "\(.*\)"$/\1/p' "$f" | head -1)"
            echo "URL: https://hagaihen.github.io/podcast-wiki/concepts/$(basename "$f" .md)"
            awk 'NR==1&&/^---/{f=1;next} f&&/^---/{f=0;next} !f' "$f" | sed -E 's#\[\[([^]|]+)\]\]#[\1](https://hagaihen.github.io/podcast-wiki/\1)#g'
            echo
          done > public/llms-full.txt
      - uses: actions/upload-pages-artifact@v3
        with: { path: quartz/public }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
